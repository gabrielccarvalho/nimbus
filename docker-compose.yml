services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 2s
      timeout: 3s
      retries: 30

  # minio/minio is no longer published; Bitnami's frozen builds are MinIO too.
  minio:
    profiles: [s3]
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: nimbus
      MINIO_ROOT_PASSWORD: nimbus-secret
      # MinIO has no bucket CORS (PutBucketCors is NotImplemented), only this.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    profiles: [s3]
    image: bitnamilegacy/minio-client:2025.7.21
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 nimbus nimbus-secret &&
        mc mb --ignore-existing local/nimbus

volumes:
  pgdata:
  miniodata:
