# Self-hosted Nimbus on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.selfhost.yml \
#     --env-file .env.selfhost --profile selfhost up -d --build
#
# Postgres stays on the internal network and MinIO publishes only its S3 port,
# which browsers need for signed URLs.

x-app-env: &app-env
  DATABASE_URL: postgres://nimbus:nimbus@db:5432/nimbus
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9010}
  S3_BUCKET: nimbus
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.selfhost}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.selfhost}
  S3_FORCE_PATH_STYLE: "true"

x-app-env-file: &app-env-file
  - .env.selfhost

services:
  db:
    ports: !reset []

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.selfhost}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.selfhost}
    ports: !override
      - "${NIMBUS_S3_PORT:-9010}:9000"

  minio-init:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/nimbus

  migrate:
    profiles: [selfhost]
    build: &worker-build
      context: .
      dockerfile: Dockerfile.worker
    image: nimbus-worker
    command:
      [
        "node",
        "--conditions=react-server",
        "--import",
        "tsx",
        "scripts/migrate.ts",
      ]
    env_file: *app-env-file
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [selfhost]
    build:
      context: .
      dockerfile: Dockerfile.web
    image: nimbus-web
    env_file: *app-env-file
    environment: *app-env
    ports:
      - "${NIMBUS_WEB_PORT:-3000}:3000"
    tmpfs:
      - /tmp
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: [selfhost]
    build: *worker-build
    image: nimbus-worker
    env_file: *app-env-file
    environment: *app-env
    volumes:
      - scratch:/tmp/nimbus
    depends_on: *app-deps
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
    # WORKER_SHUTDOWN_GRACE_MS (25 s) plus time to abort and hand jobs back.
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  scratch:
